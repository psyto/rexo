# Rexo is a redaction / secret-scanning tool: its tests and fixtures intentionally
# contain fabricated secret-shaped strings (fake API keys, emails, phones) to
# exercise the scanner and the redaction pipeline. None are real credentials.
# Exclude those paths from secret-scanning alerts to avoid false-positive noise.
paths-ignore:
  - "fixtures/**"
  - "test/**"
  - "docs/**"
